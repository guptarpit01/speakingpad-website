# ──────────────────────────────────────────────────────────────
# SpeakingPad — Daily Blog Article Generator
# Runs every day at 6:00 AM IST (00:30 UTC) via GitHub Actions.
# Generates a new article using Gemini, commits it, and pushes.
# ──────────────────────────────────────────────────────────────

name: Daily Blog Post

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      linkedin_only:
        description: 'Repost the latest existing article to LinkedIn (does not generate a blog)'
        required: false
        default: false
        type: boolean
      linkedin_test:
        description: 'Generate a new test article for LinkedIn only (never writes to the website)'
        required: false
        default: false
        type: boolean

concurrency:
  group: speakingpad-daily-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test LinkedIn publisher
        run: python -m unittest discover -s tests -v

      - name: Generate blog article
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.linkedin_only && !inputs.linkedin_test) }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate_blog.py

      - name: Commit and push new article
        id: publish_blog
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.linkedin_only && !inputs.linkedin_test) }}
        run: |
          git config user.name "SpeakingPad Blog Bot"
          git config user.email "blog-bot@speakingpad.in"
          git add posts/ blog-data.json sitemap.xml
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new article generated. Nothing to commit."
            echo "article_created=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "📝 New blog article — ${DATE}"
            git push
            echo "article_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate LinkedIn-only test article
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linkedin_test }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/generate_linkedin_test.py --output "$RUNNER_TEMP/linkedin-test-payload.json"

      - name: Verify LinkedIn test did not change website files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linkedin_test }}
        run: |
          git diff --exit-code
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/repository-status.txt"
          if [ -s "$RUNNER_TEMP/repository-status.txt" ]; then
            echo "LinkedIn-only generation unexpectedly changed repository files:"
            sed -n '1,100p' "$RUNNER_TEMP/repository-status.txt"
            exit 1
          fi

      - name: Publish generated article to LinkedIn
        if: ${{ !inputs.linkedin_test && (steps.publish_blog.outputs.article_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.linkedin_only)) }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/publish_linkedin.py

      - name: Publish test article to LinkedIn only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linkedin_test }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/publish_linkedin.py --payload "$RUNNER_TEMP/linkedin-test-payload.json"
